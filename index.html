<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER TOÑITA - FIDELIZACION</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .minimal-card {
            background: rgba(246, 248, 250, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-radius: 16px;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 py-4 px-6 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-semibold tracking-tight text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-500"></i> SUPER TOÑITA
            </h1>
            <div class="flex gap-3">
                <button id="btn-nav-auth" onclick="switchView('auth')" class="px-4 py-2 text-sm font-medium rounded-full bg-slate-900 text-white hover:bg-slate-800 transition-colors">Acceso</button>
                <button id="btn-nav-client" onclick="switchView('client')" class="hidden px-4 py-2 text-sm font-medium rounded-full bg-slate-100 hover:bg-slate-200 transition-colors">Mi Perfil</button>
                <button id="btn-nav-admin" onclick="switchView('admin')" class="hidden px-4 py-2 text-sm font-medium rounded-full bg-slate-100 hover:bg-slate-200 transition-colors">Panel Admin</button>
                <button id="btn-logout" onclick="logout()" class="hidden px-4 py-2 text-sm font-medium rounded-full text-rose-600 bg-rose-50 hover:bg-rose-100 transition-colors">Salir</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-6 py-8">

        <!-- VISTA AUTH -->
        <section id="auth-view" class="space-y-6 max-w-md mx-auto">
            <div class="minimal-card p-8 text-center">
                <i class="fa-solid fa-user-circle text-4xl text-indigo-600 mb-2"></i>
                <h3 class="text-xl font-bold text-slate-900">SUPER TOÑITA CORINTO</h3>
                <div class="space-y-4 mt-6">
                    <input type="text" id="login-identifier" placeholder="Tu Nombre" class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50/50">
                    <input type="text" id="login-secret" placeholder="Teléfono" class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50/50">
                    <button onclick="handleLogin()" class="w-full py-3 bg-slate-900 text-white font-medium rounded-xl hover:bg-slate-800 transition-all">Ingresar</button>
                </div>
            </div>
        </section>

        <!-- VISTA CLIENTE -->
        <section id="client-view" class="hidden space-y-6">
            <div class="minimal-card p-8 flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
                <div>
                    <h2 class="text-3xl font-bold text-slate-900" id="client-name">Invitado</h2>
                    <p class="text-slate-500 text-sm" id="client-phone-display"></p>
                </div>
                <div class="bg-indigo-50 px-6 py-3 rounded-2xl">
                    <span class="text-xs text-indigo-400 block font-bold uppercase">Tus Puntos</span>
                    <span class="text-4xl font-black text-indigo-600" id="client-points">0</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Canje -->
                <div class="minimal-card p-6">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-camera"></i> Escanear</h3>
                    <button onclick="startCameraScanner()" class="w-full py-3 bg-slate-900 text-white rounded-xl mb-3">Abrir Cámara</button>
                    <div id="qr-reader" class="hidden w-full mb-4 border rounded-xl overflow-hidden"></div>
                    <div class="flex gap-2">
                        <input type="text" id="qr-input" placeholder="Código manual" class="w-full px-4 py-3 border rounded-xl bg-slate-50/50 text-sm">
                        <button onclick="claimPoints()" class="bg-indigo-600 text-white px-4 rounded-xl">Ok</button>
                    </div>
                </div>
                <!-- Mis Canjes Activos -->
                <div class="minimal-card p-6">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-emerald-600"><i class="fa-solid fa-ticket"></i> Mis Cupones</h3>
                    <div id="client-redemptions-list" class="space-y-3 max-h-60 overflow-y-auto pr-2">
                        <!-- Cupones cargan aquí -->
                    </div>
                </div>
            </div>

            <div class="minimal-card p-8">
                <h3 class="text-xl font-bold text-slate-900 mb-6">Premios que puedes canjear</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="client-rewards-container"></div>
            </div>
        </section>

        <!-- VISTA ADMIN -->
        <section id="admin-view" class="hidden space-y-6">
            <!-- Puntos e Impresión -->
            <div class="minimal-card p-8">
                <h3 class="text-xl font-bold text-slate-900 mb-6">Generador de Ticket</h3>
                <div class="flex gap-4 mb-6">
                    <input type="number" id="qr-bill-amount" placeholder="Monto Venta $" class="w-full px-4 py-3 border rounded-xl">
                    <button onclick="generateQRCodes()" class="px-6 py-3 bg-slate-900 text-white rounded-xl">Generar</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 border rounded-xl bg-slate-50/30 text-center">
                    <div><div id="qr-link-container" class="bg-white p-2 inline-block rounded"></div></div>
                    <div>
                        <div id="qr-points-container" class="bg-white p-2 inline-block rounded"></div>
                        <p id="qr-points-label" class="text-xs font-bold text-indigo-600 mt-2">0 pts</p>
                    </div>
                </div>
                <button onclick="printQRCodes()" class="w-full mt-4 py-4 bg-emerald-600 text-white font-bold rounded-xl flex items-center justify-center gap-2">
                    <i class="fa-solid fa-print"></i> IMPRIMIR TICKET (58/80MM)
                </button>
            </div>

            <!-- Dashboard de Canjes (NUEVO) -->
            <div class="minimal-card p-8 border-l-4 border-amber-500">
                <h3 class="text-xl font-bold text-slate-900 mb-6 flex justify-between">
                    Canjes por Entregar 
                    <span id="admin-pending-count" class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-sm">0</span>
                </h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left">
                        <thead>
                            <tr class="text-xs text-slate-400 uppercase border-b">
                                <th class="pb-2">Cliente / Producto</th>
                                <th class="pb-2 text-right">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="admin-pending-redemptions"></tbody>
                    </table>
                </div>
            </div>

            <!-- Tabla Clientes -->
            <div class="minimal-card p-8">
                <h3 class="text-xl font-bold text-slate-900 mb-6">Base de Clientes</h3>
                <tbody id="admin-clients-table" class="block"></tbody>
            </div>

            <!-- Gestión Productos -->
            <div class="minimal-card p-8">
                <h3 class="text-xl font-bold text-slate-900 mb-4">Añadir Producto</h3>
                <div class="flex gap-2 mb-6">
                    <input type="text" id="new-product-name" placeholder="Nombre" class="w-full px-3 py-2 border rounded-lg">
                    <input type="number" id="new-product-points" placeholder="Pts" class="w-24 px-3 py-2 border rounded-lg">
                    <button onclick="addProduct()" class="bg-slate-900 text-white px-4 rounded-lg"> + </button>
                </div>
                <div id="admin-products-list" class="divide-y"></div>
            </div>
        </section>
    </main>

    <footer class="py-6 text-center text-xs text-slate-400">SUPER TOÑITA - GESTIÓN FIDELIZACIÓN 2026</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, deleteDoc, onSnapshot, getDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCahZbwdPB5zBR_rdxTp4RIRmUoiGkyUOk",
            authDomain: "fidelidad-487f8.firebaseapp.com",
            projectId: "fidelidad-487f8",
            storageBucket: "fidelidad-487f8.firebasestorage.app",
            messagingSenderId: "840301803243",
            appId: "1:840301803243:web:be1612291a7765dab5b0ae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.SECURITY_KEY = "1234";

        // Listeners
        onSnapshot(collection(db, "products"), (s) => {
            window.availableProducts = s.docs.map(d => ({id: d.id, ...d.data()}));
            window.renderProducts();
        });

        onSnapshot(collection(db, "clients"), (s) => {
            window.registeredClients = s.docs.map(d => ({id: d.id, ...d.data()}));
            window.updateClientsTable();
            if(window.activeClient) {
                window.activeClient = window.registeredClients.find(c => c.id === window.activeClient.id);
                document.getElementById('client-points').innerText = window.activeClient.points;
            }
        });

        // Monitor de Canjes (Admin y Cliente)
        onSnapshot(collection(db, "redemptions"), (s) => {
            const allRedemptions = s.docs.map(d => ({id: d.id, ...d.data()}));
            
            // Para el Admin: Todos los pendientes
            const pending = allRedemptions.filter(r => r.status === "pendiente");
            document.getElementById('admin-pending-count').innerText = pending.length;
            document.getElementById('admin-pending-redemptions').innerHTML = pending.map(r => `
                <tr class="border-b text-sm">
                    <td class="py-3">
                        <div class="font-bold">${r.productName}</div>
                        <div class="text-xs text-slate-500">${r.clientName} (${r.clientPhone})</div>
                    </td>
                    <td class="text-right">
                        <button onclick="deliverProduct('${r.id}')" class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg text-xs font-bold hover:bg-emerald-200">
                            ENTREGAR
                        </button>
                    </td>
                </tr>
            `).join('');

            // Para el Cliente: Solo los suyos
            if(window.activeClient) {
                const myRedemptions = allRedemptions.filter(r => r.clientPhone === window.activeClient.phone);
                document.getElementById('client-redemptions-list').innerHTML = myRedemptions.length ? myRedemptions.map(r => `
                    <div class="p-3 border rounded-xl bg-white flex justify-between items-center shadow-sm ${r.status === 'entregado' ? 'opacity-50' : 'border-emerald-200'}">
                        <div>
                            <div class="font-bold text-xs">${r.productName}</div>
                            <div class="text-[10px] text-slate-400">${r.date}</div>
                        </div>
                        <span class="text-[10px] font-bold uppercase ${r.status === 'pendiente' ? 'text-amber-500' : 'text-slate-400'}">
                            ${r.status === 'pendiente' ? 'Listito' : 'Entregado'}
                        </span>
                    </div>
                `).join('') : '<p class="text-xs text-slate-400 text-center py-4">No tienes canjes activos.</p>';
            }
        });

        window.deliverProduct = async (id) => {
            const { updateDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
            if(confirm("¿Confirmas que ya entregaste este producto al cliente?")) {
                // Lo marcamos como entregado (o podrías borrarlo con deleteDoc)
                await updateDoc(doc(window.db, "redemptions", id), { status: "entregado" });
            }
        };

        window.addProduct = async () => {
            const n = document.getElementById('new-product-name').value;
            const p = parseInt(document.getElementById('new-product-points').value);
            if(n && p) await addDoc(collection(db, "products"), { name: n, points: p });
        };

        window.deleteProduct = async (id) => {
            if(confirm("¿Eliminar?")) await deleteDoc(doc(db, "products", id));
        };
    </script>

    <script>
        function switchView(view) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(view + '-view').classList.remove('hidden');
            document.getElementById('btn-nav-auth').classList.toggle('hidden', view !== 'auth');
            document.getElementById('btn-nav-client').classList.toggle('hidden', !window.activeClient && !window.isAdminActive);
            document.getElementById('btn-nav-admin').classList.toggle('hidden', !window.isAdminActive);
            document.getElementById('btn-logout').classList.toggle('hidden', view === 'auth');
        }

        async function handleLogin() {
            const user = document.getElementById('login-identifier').value.trim();
            const pass = document.getElementById('login-secret').value.trim();
            if (user === "josefrank" && pass === "199818") {
                window.isAdminActive = true;
                switchView('admin');
                return;
            }
            let client = window.registeredClients.find(c => c.phone === pass);
            if (!client) {
                const { addDoc, collection } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
                const docRef = await addDoc(collection(window.db, "clients"), { name: user, phone: pass, points: 100 });
                client = { id: docRef.id, name: user, phone: pass, points: 100 };
            }
            window.activeClient = client;
            document.getElementById('client-name').innerText = client.name;
            document.getElementById('client-phone-display').innerText = client.phone;
            switchView('client');
        }

        function logout() { location.reload(); }

        function generateQRCodes() {
            const amt = parseFloat(document.getElementById('qr-bill-amount').value);
            if(!amt) return alert("Ingresa el monto");
            const pts = Math.floor(amt);
            const uid = "ST-" + Date.now();
            document.getElementById('qr-link-container').innerHTML = '';
            document.getElementById('qr-points-container').innerHTML = '';
            new QRCode(document.getElementById('qr-link-container'), { text: "https://supertonita.github.io/fidelidad/", width: 150, height: 150 });
            new QRCode(document.getElementById('qr-points-container'), { text: JSON.stringify({pts, id: uid}), width: 150, height: 150 });
            document.getElementById('qr-points-label').innerText = pts + " Puntos (ID: " + uid + ")";
        }

        function printQRCodes() {
            const link = document.getElementById('qr-link-container').innerHTML;
            const ptsQR = document.getElementById('qr-points-container').innerHTML;
            if(!ptsQR) return;
            const p = window.open('', '', 'width=400,height=600');
            p.document.write(`<html><head><style>body{font-family:monospace;text-align:center;} .qr{width:160px;margin:10px auto;} .qr img{width:100%;}</style></head>
                <body onload="window.print(); window.close();">
                    <h2>SUPER TOÑITA</h2><hr>
                    <p><b>INSTALA LA APP</b></p><div class="qr">${link}</div><hr>
                    <p><b>TUS PUNTOS</b></p><div class="qr">${ptsQR}</div>
                    <p>${document.getElementById('qr-points-label').innerText}</p>
                </body></html>`);
            p.document.close();
        }

        window.updateClientsTable = () => {
            const table = document.getElementById('admin-clients-table');
            table.innerHTML = window.registeredClients.map(c => `
                <div class="flex justify-between items-center py-3 border-b text-sm">
                    <div><b>${c.name}</b><br><span class="text-xs text-slate-400">${c.phone}</span></div>
                    <div class="flex items-center gap-4">
                        <span class="font-bold text-indigo-600">${c.points} pts</span>
                        <button onclick="openWhatsApp('${c.phone}','${c.name}')" class="text-emerald-600"><i class="fa-brands fa-whatsapp text-lg"></i></button>
                        <button onclick="deleteClient('${c.id}','${c.name}')" class="text-rose-600"><i class="fa-solid fa-user-xmark"></i></button>
                    </div>
                </div>
            `).join('');
        };

        window.openWhatsApp = (tel, nom) => {
            const msg = encodeURIComponent(`Hola ${nom}, tienes ${window.registeredClients.find(c=>c.phone===tel).points} puntos en Super Toñita.`);
            window.open(`https://wa.me/${tel.replace(/\D/g,'')}?text=${msg}`);
        };

        window.deleteClient = async (id, name) => {
            if(prompt(`Escribe ${window.SECURITY_KEY} para borrar a ${name}`) === window.SECURITY_KEY) {
                const { deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
                await deleteDoc(doc(window.db, "clients", id));
            }
        };

        window.renderProducts = () => {
            const cont = document.getElementById('client-rewards-container');
            const adm = document.getElementById('admin-products-list');
            cont.innerHTML = window.availableProducts.map(p => `
                <div class="p-4 border rounded-xl flex justify-between items-center bg-white shadow-sm">
                    <div><b>${p.name}</b><br><span class="text-xs text-indigo-500 font-bold">${p.points} pts</span></div>
                    <button onclick="redeemProduct('${p.id}', '${p.name}', ${p.points})" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold uppercase">Canjear</button>
                </div>`).join('');
            adm.innerHTML = window.availableProducts.map(p => `
                <div class="flex justify-between py-2 text-sm">
                    <span>${p.name} (${p.points})</span>
                    <button onclick="deleteProduct('${p.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button>
                </div>`).join('');
        };

        async function redeemProduct(prodId, prodName, cost) {
            if(window.activeClient.points < cost) return alert("No tienes puntos suficientes.");
            if(!confirm(`¿Canjear ${prodName} por ${cost} puntos?`)) return;

            const { updateDoc, addDoc, collection, doc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
            
            // 1. Restar puntos
            await updateDoc(doc(window.db, "clients", window.activeClient.id), { 
                points: window.activeClient.points - cost 
            });

            // 2. Crear registro de canje
            await addDoc(collection(window.db, "redemptions"), {
                clientId: window.activeClient.id,
                clientName: window.activeClient.name,
                clientPhone: window.activeClient.phone,
                productName: prodName,
                status: "pendiente",
                date: new Date().toLocaleString()
            });

            alert("¡Canje exitoso! Muestra tu cupón en la tienda para reclamar tu premio.");
        }

        window.startCameraScanner = () => {
            const r = document.getElementById('qr-reader');
            r.classList.remove('hidden');
            const scanner = new Html5Qrcode("qr-reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
                document.getElementById('qr-input').value = txt;
                claimPoints();
                scanner.stop();
                r.classList.add('hidden');
            }).catch(e => alert("Error cámara"));
        };

        async function claimPoints() {
            const val = document.getElementById('qr-input').value;
            try {
                const data = JSON.parse(val);
                const { doc, getDoc, setDoc, updateDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
                const usedRef = doc(window.db, "used_codes", data.id);
                const snap = await getDoc(usedRef);
                if(snap.exists()) return alert("Código ya usado");
                await setDoc(usedRef, { used: true, by: window.activeClient.name });
                await updateDoc(doc(window.db, "clients", window.activeClient.id), { points: window.activeClient.points + data.pts });
                alert("¡Puntos cargados!");
                document.getElementById('qr-input').value = '';
            } catch(e) { alert("QR inválido"); }
        }
    </script>
</body>
</html>
