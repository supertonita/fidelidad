<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyalty Pro - Sistema de Fidelización</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .hidden { display: none; }
        #qr-reader { width: 100% !important; border: none !important; border-radius: 1rem; overflow: hidden; }
        #qr-reader__dashboard { display: none !important; }
    </style>
</head>
<body class="pb-24">

    <!-- NAVEGACIÓN -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-slate-100 z-50 px-6 py-3">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="switchView('auth')" id="btn-nav-auth" class="flex flex-col items-center text-indigo-600">
                <i class="fa-solid fa-user-lock text-xl"></i>
                <span class="text-[10px] mt-1 font-medium">Login</span>
            </button>
            <button onclick="switchView('client')" id="btn-nav-client" class="hidden flex flex-col items-center text-slate-400">
                <i class="fa-solid fa-star text-xl"></i>
                <span class="text-[10px] mt-1 font-medium">Puntos</span>
            </button>
            <button onclick="switchView('admin')" id="btn-nav-admin" class="hidden flex flex-col items-center text-slate-400">
                <i class="fa-solid fa-gauge-high text-xl"></i>
                <span class="text-[10px] mt-1 font-medium">Panel</span>
            </button>
            <button onclick="logout()" id="btn-logout" class="hidden flex flex-col items-center text-rose-400">
                <i class="fa-solid fa-right-from-bracket text-xl"></i>
                <span class="text-[10px] mt-1 font-medium">Salir</span>
            </button>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 pt-8">

        <!-- 1. VISTA LOGIN -->
        <section id="auth-view" class="space-y-6">
            <div class="text-center">
                <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto shadow-xl mb-6">
                    <i class="fa-solid fa-bolt text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-900">Loyalty App</h1>
                <p class="text-slate-500">Ingresa para continuar</p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <input type="text" id="login-identifier" placeholder="Nombre / Usuario" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 outline-none">
                <input type="password" id="login-secret" placeholder="Teléfono / Clave" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 outline-none">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">ENTRAR</button>
            </div>
        </section>

        <!-- 2. VISTA CLIENTE -->
        <section id="client-view" class="hidden space-y-6">
            <div class="bg-indigo-600 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                <p class="text-indigo-100 text-sm">Puntos de <span id="client-name-span">---</span></p>
                <h2 class="text-5xl font-black mt-1" id="client-points">0</h2>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-bold mb-4"><i class="fa-solid fa-qrcode text-indigo-600 mr-2"></i>Sumar Puntos</h3>
                <div id="qr-reader" class="hidden mb-4"></div>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="qr-input" placeholder="Código de ticket" class="flex-1 px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 text-sm">
                    <button onclick="claimPoints()" class="bg-slate-900 text-white px-4 rounded-xl font-bold">Validar</button>
                </div>
                <button onclick="startCameraScanner()" class="w-full border-2 border-indigo-600 text-indigo-600 font-bold py-3 rounded-xl"><i class="fa-solid fa-camera mr-2"></i> USAR CÁMARA</button>
            </div>
            <div class="space-y-4">
                <h3 class="font-bold text-slate-900"><i class="fa-solid fa-gift text-indigo-600 mr-2"></i>Canjes Disponibles</h3>
                <div id="client-rewards-container" class="space-y-3"></div>
            </div>
        </section>

        <!-- 3. VISTA ADMIN / STAFF -->
        <section id="admin-view" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-black text-slate-900 uppercase" id="admin-title">Panel</h2>
                <span id="role-badge" class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-1 rounded">STAFF</span>
            </div>

            <!-- Módulo Generador (Visible para Admin y Staff) -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-bold mb-4 text-sm">GENERAR TICKET</h3>
                <input type="number" id="qr-bill-amount" placeholder="Monto ($)" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 mb-4 font-bold">
                <button onclick="generateQRCodes()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl">CREAR QR ÚNICO</button>
                <div class="mt-4 flex flex-col items-center bg-slate-50 p-4 rounded-2xl border border-dashed border-slate-200">
                    <div id="qr-points-container" class="bg-white p-2 rounded-lg"></div>
                    <p id="qr-points-label" class="mt-2 font-bold text-indigo-600 text-xs">Esperando...</p>
                    <button onclick="printQRCodes()" class="mt-4 text-xs font-bold text-slate-500 underline">Imprimir Ticket</button>
                </div>
            </div>

            <!-- Módulos de Gestión (SOLO ADMIN) -->
            <div id="admin-only-content" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-bold mb-4 text-sm">GESTIÓN DE PREMIOS</h3>
                    <input type="text" id="new-product-name" placeholder="Nombre" class="w-full px-3 py-2 rounded-lg bg-slate-50 mb-2">
                    <input type="number" id="new-product-points" placeholder="Puntos" class="w-full px-3 py-2 rounded-lg bg-slate-50 mb-2">
                    <button onclick="addProduct()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg">AÑADIR PREMIO</button>
                    <div id="admin-products-list" class="mt-4 divide-y divide-slate-50"></div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-4 bg-slate-50 font-bold text-xs uppercase">Clientes Registrados</div>
                    <div class="overflow-x-auto"><table class="w-full text-left text-xs"><tbody id="admin-clients-table"></tbody></table></div>
                </div>
            </div>
        </section>
    </main>

    <div id="qr-link-container" class="hidden"></div> <!-- Contenedor auxiliar oculto -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // CONFIGURACIÓN FIREBASE - PEGA TUS DATOS AQUÍ
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO_ID",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        // GLOBALES
        window.activeClient = null;
        window.userRole = 'client'; // client, staff, admin
        window.registeredClients = [];
        window.availableProducts = [];

        // ESCUCHAS
        onSnapshot(collection(db, "clients"), (snap) => {
            window.registeredClients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (window.activeClient) {
                const me = window.registeredClients.find(c => c.id === window.activeClient.id);
                if (me) {
                    window.activeClient = me;
                    document.getElementById('client-points').innerText = me.points;
                }
            }
            updateClientsTable();
            renderProducts();
        });

        onSnapshot(collection(db, "products"), (snap) => {
            window.availableProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderProducts();
        });

        // NAVEGACIÓN MEJORADA
        window.switchView = (view) => {
            ['auth', 'client', 'admin'].forEach(v => document.getElementById(v+'-view').classList.add('hidden'));
            document.getElementById(view+'-view').classList.remove('hidden');
        };

        // LOGIN MULTI-ROL
        window.handleLogin = async () => {
            const user = document.getElementById('login-identifier').value.trim();
            const pass = document.getElementById('login-secret').value.trim();
            if(!user || !pass) return alert("Ingresa datos");

            // 1. ADMIN
            if(user === "josefrank" && pass === "199818") {
                window.userRole = 'admin';
                showAdminPanel(true);
                return;
            }
            // 2. STAFF (Solo genera puntos)
            if(user === "cajero" && pass === "puntos123") {
                window.userRole = 'staff';
                showAdminPanel(false);
                return;
            }

            // 3. CLIENTE
            let c = window.registeredClients.find(x => x.phone === pass);
            if(!c) {
                const res = await addDoc(collection(db, "clients"), { name: user, phone: pass, points: 100 });
                c = { id: res.id, name: user, phone: pass, points: 100 };
            }
            window.activeClient = c;
            window.userRole = 'client';
            document.getElementById('client-name-span').innerText = c.name;
            document.getElementById('btn-nav-client').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            switchView('client');
        };

        function showAdminPanel(isFullAdmin) {
            window.userRole = isFullAdmin ? 'admin' : 'staff';
            document.getElementById('admin-title').innerText = isFullAdmin ? 'Admin' : 'Cajero';
            document.getElementById('role-badge').innerText = isFullAdmin ? 'DUEÑO' : 'STAFF';
            document.getElementById('role-badge').className = isFullAdmin ? 'bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-1 rounded' : 'bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-1 rounded';
            
            if(isFullAdmin) {
                document.getElementById('admin-only-content').classList.remove('hidden');
            } else {
                document.getElementById('admin-only-content').classList.add('hidden');
            }
            
            document.getElementById('btn-nav-admin').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            switchView('admin');
        }

        // --- LÓGICA DE PUNTOS (Suma Corregida) ---
        window.claimPoints = async () => {
            const code = document.getElementById('qr-input').value.trim();
            if(!window.activeClient || !code.includes('|')) return alert("Código no reconocido");

            const [prefix, pts, tktId] = code.split('|');
            const ptsToAdd = parseInt(pts);

            try {
                const codeRef = doc(db, "used_codes", tktId);
                const codeSnap = await getDoc(codeRef);

                if(codeSnap.exists()) return alert("❌ ESTE CÓDIGO YA SE USÓ");

                // Registramos uso y sumamos puntos en una sola ejecución
                await setDoc(codeRef, { usedBy: window.activeClient.phone, at: serverTimestamp() });
                
                const clientRef = doc(db, "clients", window.activeClient.id);
                const newTotal = (window.activeClient.points || 0) + ptsToAdd;
                
                await updateDoc(clientRef, { points: newTotal });

                // Actualizar localmente para respuesta inmediata
                window.activeClient.points = newTotal;
                document.getElementById('client-points').innerText = newTotal;
                document.getElementById('qr-input').value = '';
                
                alert(`🎉 ¡Felicidades! Ganaste ${ptsToAdd} puntos.`);
                if(window.scanner) window.stopCameraScanner();
            } catch(e) { 
                console.error(e);
                alert("Error al validar. Revisa tu conexión."); 
            }
        };

        window.generateQRCodes = () => {
            const amt = parseFloat(document.getElementById('qr-bill-amount').value);
            if(!amt) return alert("Escribe un monto");
            const pts = Math.floor(amt);
            const id = "ID-" + Math.random().toString(36).substring(2, 7).toUpperCase();
            const data = `PTS|${pts}|${id}`;

            document.getElementById('qr-points-label').innerText = `${pts} Puntos - ID: ${id}`;
            document.getElementById('qr-points-container').innerHTML = '';
            new QRCode(document.getElementById('qr-points-container'), { text: data, width: 150, height: 150 });
            
            // QR Auxiliar para link
            document.getElementById('qr-link-container').innerHTML = '';
            new QRCode(document.getElementById('qr-link-container'), { text: window.location.href.split('#')[0], width: 100, height: 100 });
        };

        // GESTIÓN
        window.addProduct = async () => {
            const n = document.getElementById('new-product-name').value;
            const p = parseInt(document.getElementById('new-product-points').value);
            if(n && p) await addDoc(collection(db, "products"), { name: n, points: p });
            document.getElementById('new-product-name').value = '';
            document.getElementById('new-product-points').value = '';
        };

        window.deleteProduct = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "products", id)); };

        function renderProducts() {
            const cont = document.getElementById('client-rewards-container');
            const adm = document.getElementById('admin-products-list');
            if(!cont || !adm) return;
            cont.innerHTML = ''; adm.innerHTML = '';
            window.availableProducts.forEach(p => {
                const can = window.activeClient && window.activeClient.points >= p.points;
                cont.innerHTML += `<div class="p-4 bg-white rounded-2xl border border-slate-100 flex justify-between items-center">
                    <div><p class="font-bold text-slate-900">${p.name}</p><p class="text-xs text-indigo-600">${p.points} pts</p></div>
                    <button onclick="redeemProduct(${p.points})" class="px-4 py-2 rounded-lg text-xs font-bold ${can?'bg-indigo-600 text-white':'bg-slate-100 text-slate-400 cursor-not-allowed'}">CANJEAR</button>
                </div>`;
                adm.innerHTML += `<div class="py-2 flex justify-between text-xs"><span>${p.name} (${p.points})</span><button onclick="deleteProduct('${p.id}')" class="text-rose-500">Eliminar</button></div>`;
            });
        }

        window.redeemProduct = async (pts) => {
            if(window.activeClient.points < pts) return;
            if(confirm("¿Confirmar canje?")) {
                const nt = window.activeClient.points - pts;
                await updateDoc(doc(db, "clients", window.activeClient.id), { points: nt });
                alert("Canje registrado con éxito.");
            }
        };

        function updateClientsTable() {
            const t = document.getElementById('admin-clients-table');
            if(!t) return;
            t.innerHTML = '';
            window.registeredClients.forEach(c => {
                t.innerHTML += `<tr class="border-b border-slate-50">
                    <td class="p-3"><b>${c.name}</b><br>${c.phone}</td>
                    <td class="p-3 text-indigo-600 font-bold">${c.points}</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteClient('${c.id}')" class="text-rose-400"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            });
        }

        window.deleteClient = async (id) => { if(prompt("Clave Admin:")==="199818") await deleteDoc(doc(db, "clients", id)); };

        // CÁMARA
        window.startCameraScanner = () => {
            document.getElementById('qr-reader').classList.remove('hidden');
            window.scanner = new Html5Qrcode("qr-reader");
            window.scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                document.getElementById('qr-input').value = text;
                window.claimPoints();
            });
        };
        window.stopCameraScanner = () => { if(window.scanner) window.scanner.stop().then(()=>document.getElementById('qr-reader').classList.add('hidden')); };

        // IMPRESIÓN
        window.printQRCodes = () => {
            const win = window.open('', '', 'width=300,height=600');
            win.document.write(`<html><body style="text-align:center;font-family:monospace;padding:10px">
                <h3>LOYALTY PRO</h3>
                ${document.getElementById('qr-link-container').innerHTML}<p style="font-size:10px">1. Entra a la App</p>
                <hr style="border: 1px dashed #000">
                ${document.getElementById('qr-points-container').innerHTML}
                <h3>${document.getElementById('qr-points-label').innerText}</h3>
                <p style="font-size:10px">2. Escanea para sumar puntos</p>
            </body></html>`);
            win.document.close();
            setTimeout(() => { win.print(); win.close(); }, 500);
        };

        window.logout = () => location.reload();
        window.switchView('auth');
    </script>
</body>
</html>
