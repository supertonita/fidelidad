<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER TOÑITA - FIDELIZACION</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .minimal-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 20px;
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-black tracking-tighter text-slate-900">
                <i class="fa-solid fa-star text-amber-500"></i> SUPER TOÑITA
            </h1>
            <div class="flex gap-2">
                <button id="btn-nav-auth" onclick="switchView('auth')" class="px-4 py-2 text-sm font-bold rounded-full bg-slate-900 text-white">Entrar</button>
                <button id="btn-nav-client" onclick="switchView('client')" class="hidden px-4 py-2 text-sm font-bold rounded-full bg-slate-100">Mi Perfil</button>
                <button id="btn-nav-admin" onclick="switchView('admin')" class="hidden px-4 py-2 text-sm font-bold rounded-full bg-indigo-50 text-indigo-600">Admin</button>
                <button id="btn-logout" onclick="logout()" class="hidden px-4 py-2 text-sm font-bold rounded-full bg-rose-50 text-rose-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- LOGIN -->
        <section id="auth-view" class="max-w-md mx-auto pt-10">
            <div class="minimal-card p-8 text-center shadow-2xl shadow-slate-200">
                <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6 rotate-3">
                    <i class="fa-solid fa-bag-shopping text-white text-3xl"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-900 mb-2">¡Hola!</h2>
                <p class="text-slate-400 text-sm mb-8">Ingresa para ver tus puntos y premios</p>
                <div class="space-y-4">
                    <input type="text" id="login-identifier" placeholder="Nombre completo" class="w-full px-5 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    <input type="text" id="login-secret" placeholder="Número de Teléfono" class="w-full px-5 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button onclick="handleLogin()" class="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg shadow-indigo-200 active:scale-95 transition-all">ACCEDER AHORA</button>
                </div>
            </div>
        </section>

        <!-- CLIENTE -->
        <section id="client-view" class="hidden space-y-6">
            <div class="minimal-card p-6 flex flex-col md:flex-row items-center justify-between gap-4 border-b-4 border-indigo-500">
                <div>
                    <h2 class="text-3xl font-black text-slate-900" id="client-name">...</h2>
                    <p class="text-slate-400 font-bold" id="client-phone-display"></p>
                </div>
                <div class="bg-slate-900 px-10 py-5 rounded-[30px] text-white text-center">
                    <span class="text-[10px] text-indigo-400 block font-black uppercase tracking-tighter">Puntos Disponibles</span>
                    <span class="text-5xl font-black" id="client-points">0</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Sumar -->
                <div class="minimal-card p-6">
                    <h3 class="font-black mb-4 text-slate-900 uppercase text-xs tracking-widest"><i class="fa-solid fa-qrcode mr-2"></i>Escanear Ticket</h3>
                    <button onclick="startCameraScanner()" class="w-full py-4 bg-indigo-50 text-indigo-600 rounded-2xl font-black mb-4 hover:bg-indigo-100 transition-colors">ABRIR CAMARA</button>
                    <div id="qr-reader" class="hidden rounded-2xl overflow-hidden mb-4 border-4 border-white shadow-lg"></div>
                    <div class="flex gap-2">
                        <input type="text" id="qr-input" placeholder="O escribe el código" class="w-full px-4 py-3 bg-slate-50 border-none rounded-xl text-sm">
                        <button onclick="claimPoints()" class="bg-slate-900 text-white px-6 rounded-xl font-black">OK</button>
                    </div>
                </div>

                <!-- HISTORIAL CLIENTE -->
                <div class="minimal-card p-6">
                    <h3 class="font-black mb-4 text-slate-900 uppercase text-xs tracking-widest"><i class="fa-solid fa-receipt mr-2 text-emerald-500"></i>Mis Canjes Recientes</h3>
                    <div id="client-redemptions-list" class="space-y-3 max-h-60 overflow-y-auto custom-scroll pr-2">
                        <!-- Aquí se muestran los canjes -->
                    </div>
                </div>
            </div>

            <div class="minimal-card p-6">
                <h3 class="text-xl font-black text-slate-900 mb-6">Premios para Canjear</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="client-rewards-container"></div>
            </div>
        </section>

        <!-- ADMIN -->
        <section id="admin-view" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Generador -->
                <div class="minimal-card p-6 border-t-4 border-indigo-500">
                    <h3 class="font-black mb-4 text-xs uppercase text-slate-400">Generar Ticket de Puntos</h3>
                    <input type="number" id="qr-bill-amount" placeholder="Monto total de venta" class="w-full px-4 py-4 bg-slate-50 border-none rounded-2xl mb-3 font-bold">
                    <button onclick="generateQRCodes()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-100">CREAR CÓDIGO QR</button>
                    <div class="flex flex-col items-center mt-6 p-4 bg-white rounded-3xl border border-slate-100">
                        <div id="qr-points-container" class="p-2"></div>
                        <p id="qr-points-label" class="text-[10px] font-black text-indigo-600 mt-2">LISTO PARA ESCANEAR</p>
                    </div>
                    <button onclick="printQRCodes()" class="w-full mt-4 py-3 bg-emerald-500 text-white rounded-xl font-black"><i class="fa-solid fa-print mr-2"></i>IMPRIMIR TICKET</button>
                </div>

                <!-- CANJES ADMIN -->
                <div class="minimal-card p-6 border-t-4 border-rose-500">
                    <h3 class="font-black mb-4 flex justify-between items-center text-xs uppercase text-slate-400">
                        ENTREGAS PENDIENTES <span id="admin-pending-count" class="bg-rose-500 text-white px-3 py-1 rounded-full text-[10px]">0</span>
                    </h3>
                    <div class="space-y-3 max-h-[400px] overflow-y-auto custom-scroll pr-2" id="admin-pending-redemptions">
                        <!-- Aquí aparecen los pendientes para el jefe -->
                    </div>
                </div>
            </div>

            <!-- TABLA -->
            <div class="minimal-card p-6">
                <h3 class="font-black mb-4 text-xs uppercase text-slate-400 tracking-widest">Nuestros Clientes</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-slate-400 text-[10px] uppercase border-b">
                                <th class="pb-4">Cliente</th>
                                <th class="pb-4 text-center">Puntos</th>
                                <th class="pb-4 text-right">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="admin-clients-table"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, deleteDoc, onSnapshot, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCahZbwdPB5zBR_rdxTp4RIRmUoiGkyUOk",
            authDomain: "fidelidad-487f8.firebaseapp.com",
            projectId: "fidelidad-487f8",
            storageBucket: "fidelidad-487f8.firebasestorage.app",
            messagingSenderId: "840301803243",
            appId: "1:840301803243:web:be1612291a7765dab5b0ae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        // CARGA INICIAL Y REALTIME
        onSnapshot(collection(db, "products"), (s) => {
            window.availableProducts = s.docs.map(d => ({id: d.id, ...d.data()}));
            window.renderProducts();
        });

        onSnapshot(collection(db, "clients"), (s) => {
            window.registeredClients = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.points - a.points);
            window.updateClientsTable();
            if(window.activeClient) {
                const me = window.registeredClients.find(c => c.phone === window.activeClient.phone);
                if(me) {
                    window.activeClient = me;
                    document.getElementById('client-points').innerText = me.points;
                }
            }
        });

        // ESTA ES LA CLAVE: El listener global de canjes
        onSnapshot(collection(db, "redemptions"), (s) => {
            window.allRedemptions = s.docs.map(d => ({id: d.id, ...d.data()}))
                                        .sort((a,b) => new Date(b.dateSort) - new Date(a.dateSort));
            window.renderRedemptions();
        });

        // FUNCIONES ADMIN
        window.deliverProduct = async (id) => {
            if(confirm("¿Ya entregaste este producto?")) {
                await updateDoc(doc(db, "redemptions", id), { status: "entregado" });
            }
        };

        window.addBonusPoints = async (id) => {
            const ref = doc(db, "clients", id);
            const snap = await getDoc(ref);
            await updateDoc(ref, { points: (snap.data().points || 0) + 20 });
            alert("¡20 puntos de regalo!");
        };
    </script>

    <script>
        window.activeClient = null;
        window.isAdminActive = false;
        window.allRedemptions = [];

        function switchView(view) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(view + '-view').classList.remove('hidden');
            document.getElementById('btn-nav-auth').classList.toggle('hidden', view !== 'auth');
            document.getElementById('btn-nav-client').classList.toggle('hidden', !window.activeClient && !window.isAdminActive);
            document.getElementById('btn-nav-admin').classList.toggle('hidden', !window.isAdminActive);
            document.getElementById('btn-logout').classList.toggle('hidden', view === 'auth');
            window.renderRedemptions();
        }

        async function handleLogin() {
            const user = document.getElementById('login-identifier').value.trim();
            const pass = document.getElementById('login-secret').value.trim();
            if (user === "josefrank" && pass === "199818") {
                window.isAdminActive = true; switchView('admin'); return;
            }
            if(!user || !pass) return alert("Llena los campos, parce");

            let client = window.registeredClients.find(c => c.phone === pass);
            if (!client) {
                const { addDoc, collection } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
                const docRef = await addDoc(collection(window.db, "clients"), { name: user, phone: pass, points: 100 });
                client = { id: docRef.id, name: user, phone: pass, points: 100 };
            }
            window.activeClient = client;
            document.getElementById('client-name').innerText = client.name;
            document.getElementById('client-phone-display').innerText = "Tel: " + client.phone;
            switchView('client');
        }

        function logout() { location.reload(); }

        window.renderRedemptions = () => {
            // 1. VISTA ADMIN (Pendientes)
            const adminPanel = document.getElementById('admin-pending-redemptions');
            if(adminPanel) {
                const pending = window.allRedemptions.filter(r => r.status === "pendiente");
                document.getElementById('admin-pending-count').innerText = pending.length;
                adminPanel.innerHTML = pending.length ? pending.map(r => `
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                        <div>
                            <p class="font-black text-slate-800 text-sm">${r.productName}</p>
                            <p class="text-[10px] text-indigo-600 font-bold uppercase">${r.clientName}</p>
                        </div>
                        <button onclick="deliverProduct('${r.id}')" class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-[10px] font-black">ENTREGAR</button>
                    </div>
                `).join('') : '<p class="text-center text-slate-300 py-10 text-xs italic">Todo entregado, jefe.</p>';
            }

            // 2. VISTA CLIENTE (Su historial personal)
            if(window.activeClient) {
                const clientPanel = document.getElementById('client-redemptions-list');
                if(clientPanel) {
                    const myHistory = window.allRedemptions.filter(r => r.clientPhone === window.activeClient.phone);
                    clientPanel.innerHTML = myHistory.length ? myHistory.map(r => `
                        <div class="flex items-center justify-between p-4 rounded-2xl bg-white border border-slate-100 shadow-sm">
                            <div>
                                <p class="font-black text-slate-800 text-sm">${r.productName}</p>
                                <p class="text-[9px] text-slate-400 font-bold uppercase">${r.date}</p>
                            </div>
                            <span class="text-[8px] font-black px-3 py-1.5 rounded-full ${r.status === 'pendiente' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}">
                                ${r.status === 'pendiente' ? 'PENDIENTE' : 'RECIBIDO'}
                            </span>
                        </div>
                    `).join('') : '<p class="text-center text-slate-300 py-10 text-xs italic">Aún no has canjeado nada.</p>';
                }
            }
        };

        window.updateClientsTable = () => {
            const tbody = document.getElementById('admin-clients-table');
            if(!tbody) return;
            tbody.innerHTML = window.registeredClients.map(c => `
                <tr class="border-b last:border-0">
                    <td class="py-4">
                        <p class="font-black text-slate-800 text-sm">${c.name}</p>
                        <p class="text-[10px] text-slate-400 font-bold">${c.phone}</p>
                    </td>
                    <td class="text-center font-black text-indigo-600 text-lg">${c.points}</td>
                    <td class="text-right">
                        <button onclick="addBonusPoints('${c.id}')" class="bg-indigo-50 text-indigo-600 p-2 rounded-lg mr-2"><i class="fa-solid fa-gift"></i></button>
                        <button onclick="window.open('https://wa.me/${c.phone}')" class="bg-emerald-50 text-emerald-600 p-2 rounded-lg"><i class="fa-brands fa-whatsapp"></i></button>
                    </td>
                </tr>
            `).join('');
        };

        window.renderProducts = () => {
            const cont = document.getElementById('client-rewards-container');
            if(!cont) return;
            cont.innerHTML = window.availableProducts.map(p => `
                <div class="p-5 bg-white border border-slate-100 rounded-3xl flex justify-between items-center shadow-sm">
                    <div>
                        <p class="font-black text-slate-800">${p.name}</p>
                        <p class="text-xs font-black text-indigo-500 tracking-tighter">${p.points} PUNTOS</p>
                    </div>
                    <button onclick="redeemProduct('${p.id}', '${p.name}', ${p.points})" class="bg-slate-900 text-white px-5 py-2.5 rounded-2xl text-[10px] font-black active:scale-90 transition-all">CANJEAR</button>
                </div>`).join('');
        };

        async function redeemProduct(prodId, prodName, cost) {
            if(window.activeClient.points < cost) return alert("Te faltan puntos, parce.");
            if(confirm(`¿Quieres canjear tus puntos por: ${prodName}?`)) {
                const { addDoc, collection, updateDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
                
                // Restar puntos
                await updateDoc(doc(window.db, "clients", window.activeClient.id), { 
                    points: window.activeClient.points - cost 
                });

                // Crear registro de canje
                await addDoc(collection(window.db, "redemptions"), {
                    clientName: window.activeClient.name,
                    clientPhone: window.activeClient.phone,
                    productName: prodName,
                    status: "pendiente",
                    date: new Date().toLocaleDateString(),
                    dateSort: new Date().toISOString()
                });
                alert("¡Canje exitoso! Avisa en caja.");
            }
        }

        // --- FUNCIONES QR ---
        function generateQRCodes() {
            const amt = document.getElementById('qr-bill-amount').value;
            if(!amt || amt <= 0) return alert("Monto no válido");
            const pts = Math.floor(amt);
            const uid = "TKT-" + Date.now();
            document.getElementById('qr-points-container').innerHTML = '';
            new QRCode(document.getElementById('qr-points-container'), { text: JSON.stringify({pts, id: uid}), width: 150, height: 150 });
            document.getElementById('qr-points-label').innerText = "VALOR: " + pts + " PUNTOS";
        }

        function printQRCodes() {
            const qr = document.getElementById('qr-points-container').innerHTML;
            const p = window.open('', '', 'width=400');
            p.document.write(`<div style="text-align:center;font-family:sans-serif;padding:20px;"><h2>SUPER TOÑITA</h2><hr>${qr}<h3>${document.getElementById('qr-points-label').innerText}</h3><p>Escanea este código en tu app</p></div>`);
            p.document.close(); p.focus(); p.print(); p.close();
        }

        window.startCameraScanner = () => {
            const r = document.getElementById('qr-reader'); r.classList.remove('hidden');
            const scanner = new Html5Qrcode("qr-reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
                document.getElementById('qr-input').value = txt; claimPoints();
                scanner.stop(); r.classList.add('hidden');
            });
        };

        async function claimPoints() {
            const val = document.getElementById('qr-input').value;
            if(!val) return;
            try {
                const data = JSON.parse(val);
                const { doc, getDoc, setDoc, updateDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
                const usedRef = doc(window.db, "used_codes", data.id);
                if((await getDoc(usedRef)).exists()) return alert("Este ticket ya se usó");
                
                const clientRef = doc(window.db, "clients", window.activeClient.id);
                const snap = await getDoc(clientRef);
                
                await setDoc(usedRef, { used: true, por: window.activeClient.name });
                await updateDoc(clientRef, { points: snap.data().points + data.pts });
                alert("¡Puntos cargados!");
                document.getElementById('qr-input').value = '';
            } catch(e) { alert("Código no válido"); }
        }
    </script>
</body>
</html>
