<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyalty Pro | Fidelización</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .hidden { display: none; }
        #qr-reader { width: 100% !important; border: none !important; border-radius: 1.5rem; overflow: hidden; }
    </style>
</head>
<body class="pb-24">

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 z-50 px-6 py-3">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="switchView('auth')" id="btn-nav-auth" class="flex flex-col items-center text-indigo-600">
                <i class="fa-solid fa-user-lock text-xl"></i>
                <span class="text-[10px] mt-1 font-medium">Login</span>
            </button>
            <button onclick="switchView('client')" id="btn-nav-client" class="hidden flex flex-col items-center text-slate-400">
                <i class="fa-solid fa-star text-xl"></i>
                <span class="text-[10px] mt-1 font-medium">Mis Puntos</span>
            </button>
            <button onclick="switchView('admin')" id="btn-nav-admin" class="hidden flex flex-col items-center text-slate-400">
                <i class="fa-solid fa-gauge-high text-xl"></i>
                <span class="text-[10px] mt-1 font-medium">Admin</span>
            </button>
            <button onclick="logout()" id="btn-logout" class="hidden flex flex-col items-center text-rose-400">
                <i class="fa-solid fa-power-off text-xl"></i>
                <span class="text-[10px] mt-1 font-medium">Salir</span>
            </button>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 pt-8">

        <section id="auth-view" class="space-y-6">
            <div class="text-center py-10">
                <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto shadow-xl mb-6">
                    <i class="fa-solid fa-bolt text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Loyalty Pro</h1>
                <p class="text-slate-500">Bienvenido de nuevo</p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <input type="text" id="login-identifier" placeholder="Nombre de usuario" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                <input type="password" id="login-secret" placeholder="Número de teléfono" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">ACCEDERHORA</button>
            </div>
        </section>

        <section id="client-view" class="hidden space-y-6">
            <div class="bg-indigo-600 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                <p class="text-indigo-100 text-sm font-medium">Hola, <span id="client-name-span">---</span></p>
                <h2 class="text-6xl font-black mt-2" id="client-points">0</h2>
                <p class="text-indigo-200 text-xs mt-1 uppercase tracking-widest font-bold">Puntos Acumulados</p>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-bold mb-4 text-slate-800 flex items-center"><i class="fa-solid fa-qrcode text-indigo-600 mr-2"></i> SUMAR PUNTOS</h3>
                <div id="qr-reader" class="hidden mb-4 border-4 border-indigo-50"></div>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="qr-input" placeholder="Código de ticket" class="flex-1 px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 text-sm">
                    <button onclick="claimPoints()" class="bg-slate-900 text-white px-5 rounded-xl font-bold">Validar</button>
                </div>
                <button onclick="startCameraScanner()" id="btn-scan" class="w-full border-2 border-indigo-600 text-indigo-600 font-bold py-3 rounded-xl hover:bg-indigo-50 transition-colors">
                    <i class="fa-solid fa-camera mr-2"></i> ESCANEAR QR
                </button>
            </div>

            <div class="space-y-4">
                <h3 class="font-bold text-slate-900 px-1">Catálogo de Premios</h3>
                <div id="client-rewards-container" class="space-y-3"></div>
            </div>
        </section>

        <section id="admin-view" class="hidden space-y-6">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xl font-black text-slate-900 uppercase tracking-tight" id="admin-title">Panel Control</h2>
                <span id="role-badge" class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-3 py-1 rounded-full uppercase">Cajero</span>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-bold mb-4 text-xs uppercase text-slate-400 tracking-widest">Generar Ticket de Puntos</h3>
                <input type="number" id="qr-bill-amount" placeholder="Monto de la compra ($)" class="w-full px-4 py-4 rounded-xl bg-slate-50 border border-slate-100 mb-4 font-bold text-lg outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="generateQRCodes()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">GENERAR CÓDIGO QR</button>
                
                <div id="qr-result-area" class="hidden mt-6 flex flex-col items-center bg-slate-50 p-6 rounded-2xl border-2 border-dashed border-slate-200">
                    <div id="qr-points-container" class="bg-white p-3 rounded-xl shadow-sm"></div>
                    <p id="qr-points-label" class="mt-4 font-black text-indigo-600 text-lg"></p>
                    <button onclick="printQRCodes()" class="mt-4 text-sm font-bold text-slate-500 hover:text-indigo-600">
                        <i class="fa-solid fa-print mr-1"></i> Imprimir Ticket
                    </button>
                </div>
            </div>

            <div id="admin-only-content" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-bold mb-4 text-xs uppercase text-slate-400 tracking-widest">Premios</h3>
                    <div class="space-y-2">
                        <input type="text" id="new-product-name" placeholder="Nombre del premio" class="w-full px-4 py-2 rounded-xl bg-slate-50 border border-slate-100">
                        <input type="number" id="new-product-points" placeholder="Puntos necesarios" class="w-full px-4 py-2 rounded-xl bg-slate-50 border border-slate-100">
                        <button onclick="addProduct()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl">AÑADIR AL CATÁLOGO</button>
                    </div>
                    <div id="admin-products-list" class="mt-6 divide-y divide-slate-100"></div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-4 bg-slate-50 font-bold text-xs uppercase text-slate-500">Clientes Registrados</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <tbody id="admin-clients-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="qr-link-container" class="hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO_ID",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        // VARIABLES GLOBALES
        window.activeClient = null;
        window.userRole = 'client';
        window.registeredClients = [];
        window.availableProducts = [];

        // ESCUCHAS DE BASE DE DATOS
        onSnapshot(collection(db, "clients"), (snap) => {
            window.registeredClients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (window.activeClient) {
                const updated = window.registeredClients.find(c => c.id === window.activeClient.id);
                if (updated) {
                    window.activeClient = updated;
                    document.getElementById('client-points').innerText = updated.points;
                }
            }
            updateClientsTable();
            renderProducts();
        });

        onSnapshot(collection(db, "products"), (snap) => {
            window.availableProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderProducts();
        });

        // NAVEGACIÓN
        window.switchView = (view) => {
            ['auth', 'client', 'admin'].forEach(v => {
                document.getElementById(v+'-view').classList.add('hidden');
                document.getElementById('btn-nav-'+v).classList.replace('text-indigo-600', 'text-slate-400');
            });
            document.getElementById(view+'-view').classList.remove('hidden');
            document.getElementById('btn-nav-'+view).classList.replace('text-slate-400', 'text-indigo-600');
        };

        // LOGIN
        window.handleLogin = async () => {
            const user = document.getElementById('login-identifier').value.trim();
            const pass = document.getElementById('login-secret').value.trim();
            
            if(!user || !pass) return alert("Completa los campos");

            // ADMIN: josefrank / 199818
            if(user === "josefrank" && pass === "199818") {
                showAdminPanel(true);
                return;
            }
            // STAFF: cajero / puntos123
            if(user === "cajero" && pass === "puntos123") {
                showAdminPanel(false);
                return;
            }

            // CLIENTE: Busca por número de teléfono
            let c = window.registeredClients.find(x => x.phone === pass);
            if(!c) {
                // Crear cliente nuevo si no existe (con 0 puntos iniciales)
                const res = await addDoc(collection(db, "clients"), { name: user, phone: pass, points: 0 });
                c = { id: res.id, name: user, phone: pass, points: 0 };
            }
            
            window.activeClient = c;
            window.userRole = 'client';
            document.getElementById('client-name-span').innerText = c.name;
            document.getElementById('btn-nav-client').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            switchView('client');
        };

        function showAdminPanel(isFullAdmin) {
            window.userRole = isFullAdmin ? 'admin' : 'staff';
            document.getElementById('admin-title').innerText = isFullAdmin ? 'Administrador' : 'Cajero';
            document.getElementById('role-badge').innerText = isFullAdmin ? 'DUEÑO' : 'STAFF';
            
            if(isFullAdmin) {
                document.getElementById('admin-only-content').classList.remove('hidden');
            } else {
                document.getElementById('admin-only-content').classList.add('hidden');
            }
            
            document.getElementById('btn-nav-admin').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            switchView('admin');
        }

        // --- LÓGICA DE PUNTOS (MEJORADA) ---
        window.generateQRCodes = () => {
            const amt = parseFloat(document.getElementById('qr-bill-amount').value);
            if(!amt) return alert("Ingresa el monto de la compra");
            
            const pts = Math.floor(amt); // Regla: Redondeo hacia abajo
            const tktId = "TKT-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            const data = `PTS|${pts}|${tktId}`;

            document.getElementById('qr-result-area').classList.remove('hidden');
            document.getElementById('qr-points-label').innerText = `${pts} PUNTOS`;
            document.getElementById('qr-points-container').innerHTML = '';
            new QRCode(document.getElementById('qr-points-container'), { text: data, width: 180, height: 180 });
            
            // Link de acceso rápido para el cliente
            document.getElementById('qr-link-container').innerHTML = '';
            new QRCode(document.getElementById('qr-link-container'), { text: window.location.href, width: 80, height: 80 });
        };

        window.claimPoints = async () => {
            const code = document.getElementById('qr-input').value.trim();
            if(!window.activeClient || !code.includes('|')) return alert("Código no reconocido");

            const [prefix, pts, tktId] = code.split('|');
            if(prefix !== "PTS") return alert("Código inválido");

            try {
                const codeRef = doc(db, "used_codes", tktId);
                const codeSnap = await getDoc(codeRef);

                if(codeSnap.exists()) return alert("❌ ESTE CÓDIGO YA FUE UTILIZADO");

                // 1. Bloquear código
                await setDoc(codeRef, { usedBy: window.activeClient.phone, at: serverTimestamp() });
                
                // 2. Sumar puntos
                const clientRef = doc(db, "clients", window.activeClient.id);
                const nuevoTotal = (window.activeClient.points || 0) + parseInt(pts);
                await updateDoc(clientRef, { points: nuevoTotal });

                alert(`🎯 ¡Genial! Has recibido ${pts} puntos.`);
                document.getElementById('qr-input').value = '';
                if(window.scanner) window.stopCameraScanner();
                
            } catch(e) {
                alert("Error al procesar. Revisa tu conexión.");
            }
        };

        // --- WHATSAPP Y TABLA ---
        window.sendWhatsApp = (phone, name, points) => {
            const cleanPhone = phone.replace(/\D/g, '');
            const msg = `¡Hola ${name}! 🌟 Tienes ${points} puntos en Loyalty Pro. ¡Pasa por tu premio pronto!`;
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        function updateClientsTable() {
            const t = document.getElementById('admin-clients-table');
            if(!t) return;
            t.innerHTML = '';
            window.registeredClients.sort((a,b) => b.points - a.points).forEach(c => {
                t.innerHTML += `
                    <tr class="border-b border-slate-50">
                        <td class="p-4">
                            <div class="font-bold text-slate-800">${c.name}</div>
                            <div class="text-[10px] text-slate-400">${c.phone}</div>
                        </td>
                        <td class="p-4 text-indigo-600 font-black text-lg text-center">${c.points}</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="sendWhatsApp('${c.phone}', '${c.name}', ${c.points})" class="text-emerald-500 bg-emerald-50 p-2 rounded-lg">
                                <i class="fa-brands fa-whatsapp"></i>
                            </button>
                            <button onclick="deleteClient('${c.id}')" class="text-rose-400 p-2">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>`;
            });
        }

        window.deleteClient = async (id) => {
            if(prompt("PIN de seguridad para borrar:") === "199818") {
                await deleteDoc(doc(db, "clients", id));
            }
        };

        // PREMIOS
        window.renderProducts = () => {
            const cont = document.getElementById('client-rewards-container');
            const adm = document.getElementById('admin-products-list');
            if(!cont || !adm) return;
            cont.innerHTML = ''; adm.innerHTML = '';
            window.availableProducts.forEach(p => {
                const canRedeem = window.activeClient && window.activeClient.points >= p.points;
                cont.innerHTML += `
                    <div class="p-5 bg-white rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                        <div>
                            <p class="font-bold text-slate-900">${p.name}</p>
                            <p class="text-xs font-bold text-indigo-600 uppercase tracking-tighter">${p.points} Puntos necesarios</p>
                        </div>
                        <button onclick="redeemProduct(${p.points}, '${p.name}')" 
                            class="px-4 py-2 rounded-xl text-xs font-black transition-all ${canRedeem ? 'bg-indigo-600 text-white shadow-md active:scale-90' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
                            CANJEAR
                        </button>
                    </div>`;
                adm.innerHTML += `
                    <div class="py-3 flex justify-between items-center text-sm">
                        <span class="text-slate-700 font-medium">${p.name} <b class="text-indigo-600">(${p.points} pts)</b></span>
                        <button onclick="deleteProduct('${p.id}')" class="text-rose-500 text-xs font-bold">BORRAR</button>
                    </div>`;
            });
        };

        window.redeemProduct = async (pts, name) => {
            if(window.activeClient.points < pts) return;
            if(confirm(`¿Quieres canjear tus puntos por: ${name}?`)) {
                const newPts = window.activeClient.points - pts;
                await updateDoc(doc(db, "clients", window.activeClient.id), { points: newPts });
                alert("✅ ¡Canje realizado! Muestra esta pantalla al cajero.");
            }
        };

        window.addProduct = async () => {
            const n = document.getElementById('new-product-name').value;
            const p = parseInt(document.getElementById('new-product-points').value);
            if(n && p) {
                await addDoc(collection(db, "products"), { name: n, points: p });
                document.getElementById('new-product-name').value = '';
                document.getElementById('new-product-points').value = '';
            }
        };

        window.deleteProduct = async (id) => { if(confirm("¿Eliminar premio?")) await deleteDoc(doc(db, "products", id)); };

        // ESCÁNER
        window.startCameraScanner = () => {
            document.getElementById('qr-reader').classList.remove('hidden');
            window.scanner = new Html5Qrcode("qr-reader");
            window.scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => {
                document.getElementById('qr-input').value = text;
                window.claimPoints();
            });
        };

        window.stopCameraScanner = () => { 
            if(window.scanner) {
                window.scanner.stop().then(() => {
                    document.getElementById('qr-reader').classList.add('hidden');
                });
            }
        };

        // IMPRESIÓN TICKET
        window.printQRCodes = () => {
            const win = window.open('', '', 'width=300,height=600');
            win.document.write(`
                <html><body style="text-align:center;font-family:monospace;padding:20px;">
                    <h2 style="margin:0">LOYALTY PRO</h2>
                    <p>Fidelización de Clientes</p>
                    <hr>
                    <div style="margin:20px 0;">${document.getElementById('qr-points-container').innerHTML}</div>
                    <h1 style="margin:0">${document.getElementById('qr-points-label').innerText}</h1>
                    <p>Escanea este código desde la App para sumar tus puntos.</p>
                    <hr>
                    <p style="font-size:10px;">ID Ticket: ${document.getElementById('qr-points-label').innerText.split('ID:')[1] || ''}</p>
                </body></html>
            `);
            win.document.close();
            setTimeout(() => { win.print(); win.close(); }, 500);
        };

        window.logout = () => location.reload();
        window.switchView('auth');
    </script>
</body>
</html>
