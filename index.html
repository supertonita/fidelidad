<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER TOÑITA - FIDELIZACION</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .minimal-card {
            background: rgba(246, 248, 250, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-radius: 16px;
        }
        @media print {
            body * { visibility: hidden; }
            #ticket-termico-print, #ticket-termico-print * { visibility: visible; }
            #ticket-termico-print { position: absolute; left: 0; top: 0; width: 58mm; display: block !important; }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 py-4 px-6 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-semibold tracking-tight text-slate-900 flex items-center gap-2">
                <img src="https://i.ibb.co/3ykG27W/logo-mini-super.png" class="h-8 w-auto rounded"> SUPER TOÑITA
            </h1>
            <div class="flex gap-3">
                <button id="btn-nav-auth" onclick="switchView('auth')" class="px-4 py-2 text-sm font-medium rounded-full bg-slate-900 text-white hover:bg-slate-800 transition-colors">Acceso</button>
                <button id="btn-nav-client" onclick="switchView('client')" class="hidden px-4 py-2 text-sm font-medium rounded-full bg-slate-100 hover:bg-slate-200 transition-colors">Mi Perfil</button>
                <button id="btn-nav-admin" onclick="switchView('admin')" class="hidden px-4 py-2 text-sm font-medium rounded-full bg-slate-100 hover:bg-slate-200 transition-colors">Panel Admin</button>
                <button id="btn-logout" onclick="logout()" class="hidden px-4 py-2 text-sm font-medium rounded-full text-rose-600 bg-rose-50 hover:bg-rose-100 transition-colors">Salir</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-6 py-8">
        <section id="auth-view" class="space-y-6 max-w-md mx-auto">
            <div class="minimal-card p-8">
                <div class="text-center mb-6">
                    <img src="https://i.ibb.co/3ykG27W/logo-mini-super.png" class="h-20 w-auto mx-auto mb-4 rounded-xl shadow-sm">
                    <h3 class="text-xl font-bold text-slate-900">SUPER TOÑITA CORINTO </h3>
                    <p class="text-sm text-slate-500 mt-1 uppercase tracking-widest">Fidelización</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="login-identifier" placeholder="Nombre / Usuario" class="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-900 bg-slate-50/50">
                    <input type="password" id="login-secret" placeholder="Teléfono / Clave" class="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-900 bg-slate-50/50">
                    <button onclick="handleLogin()" class="w-full py-3 bg-slate-900 text-white font-medium rounded-xl hover:bg-slate-800 transition-all">Ingresar</button>
                </div>
            </div>
        </section>
        
        <section id="client-view" class="hidden space-y-6">
            <div class="minimal-card p-8 text-center md:text-left flex flex-col md:flex-row items-center justify-between gap-6">
                <div>
                    <h2 class="text-3xl font-bold text-slate-900 mb-2" id="client-name">Invitado</h2>
                    <p class="text-slate-500 text-sm" id="client-phone-display">Teléfono no registrado</p>
                </div>
                <div class="text-center">
                    <span class="text-sm text-slate-400 block mb-1 uppercase tracking-widest">Puntos</span>
                    <span class="text-5xl font-extrabold text-indigo-600" id="client-points">0</span>
                </div>
            </div>
            </section>

        <section id="admin-view" class="hidden space-y-6">
            <div class="minimal-card p-8">
                <h3 class="text-xl font-bold text-slate-900 mb-6">Generador de Tickets</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <input type="number" id="qr-bill-amount" placeholder="Monto Factura ($)" class="px-4 py-3 border border-slate-200 rounded-xl bg-slate-50/50">
                    <button onclick="generateQRCodes()" class="px-4 py-3 bg-slate-900 text-white font-medium rounded-xl">Generar QRs</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6 border border-slate-100 rounded-2xl bg-slate-50/30 text-center">
                    <div>
                        <p class="text-xs text-slate-400 mb-2">QR PUNTOS</p>
                        <div id="qr-points-container" class="flex justify-center p-2 bg-white rounded-lg"></div>
                        <p id="qr-points-label" class="text-indigo-600 font-bold mt-2">0 pts</p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 mb-2">QR REGISTRO</p>
                        <div id="qr-app-link-container" class="flex justify-center p-2 bg-white rounded-lg"></div>
                        <p class="text-slate-600 text-xs mt-2">Acceso App</p>
                    </div>
                </div>
                <button onclick="printQRCodes()" class="w-full mt-6 py-4 bg-emerald-600 text-white font-bold rounded-xl shadow-lg hover:bg-emerald-700"><i class="fa-solid fa-print mr-2"></i>IMPRIMIR TICKET</button>
            </div>

            <div class="minimal-card p-8">
                <h3 class="text-xl font-bold text-slate-900 mb-6">Base de Clientes</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left">
                        <thead>
                            <tr class="text-xs font-medium text-slate-400 uppercase tracking-wider">
                                <th class="pb-4">Cliente</th>
                                <th class="pb-4">Puntos</th>
                                <th class="pb-4 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100" id="admin-clients-table"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="ticket-termico-print" class="hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCahZbwdPB5zBR_rdxTp4RIRmUoiGkyUOk",
            authDomain: "fidelidad-487f8.firebaseapp.com",
            projectId: "fidelidad-487f8",
            storageBucket: "fidelidad-487f8.firebasestorage.app",
            messagingSenderId: "840301803243",
            appId: "1:840301803243:web:be1612291a7765dab5b0ae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        onSnapshot(collection(db, "clients"), (snapshot) => {
            window.registeredClients = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            updateClientsTable();
        });

        window.deleteClientAction = async function(id) {
            if(confirm("¿Eliminar este cliente?")) {
                const pin = prompt("PIN de seguridad:");
                if(pin === "1234") { await deleteDoc(doc(db, "clients", id)); } 
                else { alert("Incorrecto"); }
            }
        };
    </script>

    <script>
        const APP_URL = "https://supertonita.github.io/fidelizacion/";

        window.switchView = function(view) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(view + '-view').classList.remove('hidden');
            document.getElementById('btn-nav-admin').classList.toggle('hidden', !window.isAdminActive);
            document.getElementById('btn-logout').classList.toggle('hidden', view === 'auth');
        };

        window.handleLogin = function() {
            const id = document.getElementById('login-identifier').value.trim();
            const sec = document.getElementById('login-secret').value.trim();
            if (id === "josefrank" && sec === "199818") {
                window.isAdminActive = true;
                window.userRole = 'admin';
                updateClientsTable();
                window.switchView('admin');
                generateAppQR();
            }
        };

        function generateAppQR() {
            const container = document.getElementById('qr-app-link-container');
            container.innerHTML = '';
            new QRCode(container, { text: APP_URL, width: 100, height: 100 });
        }

        window.generateQRCodes = function() {
            const bill = document.getElementById('qr-bill-amount').value;
            if (!bill) return;
            const pts = Math.floor(bill);
            const ptsContainer = document.getElementById('qr-points-container');
            ptsContainer.innerHTML = '';
            new QRCode(ptsContainer, { text: JSON.stringify({pts, id: Date.now()}), width: 100, height: 100 });
            document.getElementById('qr-points-label').innerText = pts + " Puntos";
        };

        window.updateClientsTable = function() {
            const tbody = document.getElementById('admin-clients-table');
            if (!tbody) return;
            tbody.innerHTML = '';
            window.registeredClients.forEach(c => {
                const btnEliminar = (window.userRole === 'admin') 
                    ? `<button onclick="deleteClientAction('${c.id}')" class="text-rose-500 p-2"><i class="fa-solid fa-trash"></i></button>` : '';

                tbody.innerHTML += `<tr>
                    <td class="py-3">
                        <div class="font-medium text-slate-900">${c.name}</div>
                        <div class="text-xs text-slate-400">${c.phone}</div>
                    </td>
                    <td class="font-bold text-indigo-600">${c.points}</td>
                    <td class="text-right flex justify-end gap-1">
                        <button onclick="window.open('https://wa.me/${c.phone.replace(/\D/g,'')}')" class="text-emerald-500 p-2"><i class="fa-brands fa-whatsapp"></i></button>
                        ${btnEliminar}
                    </td>
                </tr>`;
            });
        };

        window.printQRCodes = function() {
            const qrPoints = document.getElementById('qr-points-container').innerHTML;
            const qrApp = document.getElementById('qr-app-link-container').innerHTML;
            const ptsText = document.getElementById('qr-points-label').innerText;
            const ticket = document.getElementById('ticket-termico-print');
            ticket.innerHTML = `<div style="width:58mm;text-align:center;font-family:sans-serif;color:black;">
                <img src="https://i.ibb.co/3ykG27W/logo-mini-super.png" style="width:20mm;">
                <h3 style="font-size:12px;margin:5px 0;">SUPER TOÑITA</h3>
                <div style="display:flex;justify-content:center;">${qrPoints}</div>
                <p style="font-weight:bold;font-size:14px;margin:5px 0;">${ptsText}</p>
                <hr style="border:0.5px dashed #000;">
                <p style="font-size:9px;margin:5px 0;">REGISTRATE AQUÍ:</p>
                <div style="display:flex;justify-content:center;">${qrApp}</div>
                <p style="font-size:8px;margin-top:10px;">${new Date().toLocaleString()}</p>
            </div>`;
            window.print();
        };

        window.logout = () => { window.isAdminActive = false; window.switchView('auth'); };
    </script>
</body>
</html>
