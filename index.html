<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER TOÑITA - FIDELIZACION</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* MANTENEMOS TU DISEÑO GLASSMORPHISM */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        .bg-gradient {
            background: radial-gradient(circle at top right, #f8fafc, #e2e8f0);
            min-h-screen;
        }
    </style>
</head>
<body class="bg-gradient font-sans text-slate-800">

    <!-- HEADER ORIGINAL -->
    <header class="p-6 flex justify-between items-center max-w-4xl mx-auto">
        <h1 class="text-2xl font-black tracking-tighter text-slate-900 italic"> SUPER TOÑITA</h1>
        <div class="flex gap-2">
            <button id="btn-nav-admin" onclick="switchView('admin')" class="hidden px-4 py-2 text-xs font-bold bg-white rounded-full shadow-sm">ADMIN</button>
            <button id="btn-logout" onclick="location.reload()" class="hidden px-4 py-2 text-xs font-bold bg-rose-50 text-rose-600 rounded-full">SALIR</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-10">
        
        <!-- VISTA AUTH -->
        <section id="auth-view" class="pt-10 max-w-md mx-auto">
            <div class="glass-card p-10 text-center">
                <h2 class="text-3xl font-black mb-8">Bienvenido </h2>
                <input type="text" id="login-identifier" placeholder="Tu Nombre" class="w-full p-4 mb-4 rounded-2xl bg-white/50 border-none focus:ring-2 focus:ring-indigo-400 outline-none">
                <input type="text" id="login-secret" placeholder="Tu Teléfono" class="w-full p-4 mb-6 rounded-2xl bg-white/50 border-none focus:ring-2 focus:ring-indigo-400 outline-none">
                <button onclick="handleLogin()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl hover:scale-[1.02] transition-all">ENTRAR</button>
            </div>
        </section>

        <!-- VISTA CLIENTE -->
        <section id="client-view" class="hidden space-y-6">
            <div class="glass-card p-8 flex justify-between items-center border-b-4 border-indigo-500">
                <div>
                    <h2 id="client-name" class="text-3xl font-black">...</h2>
                    <p id="client-phone-display" class="text-slate-500 font-bold"></p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-black uppercase text-indigo-600">Puntos Totales</p>
                    <p id="client-points" class="text-5xl font-black">0</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- HISTORIAL DE CANJES (LO QUE NO SE VEÍA) -->
                <div class="glass-card p-6">
                    <h3 class="font-black mb-4 text-xs uppercase tracking-widest"><i class="fa-solid fa-clock-rotate-left mr-2"></i>Mis Canjes</h3>
                    <div id="client-redemptions-list" class="space-y-3 max-h-60 overflow-y-auto">
                        <!-- Aquí aparecerán los canjes -->
                    </div>
                </div>

                <div class="glass-card p-6 text-center">
                    <h3 class="font-black mb-4 text-xs uppercase">Sumar Puntos</h3>
                    <button onclick="startScanner()" class="w-full py-4 border-2 border-dashed border-slate-300 rounded-3xl font-bold text-slate-500 hover:bg-white/50">Abrir Cámara</button>
                    <div id="reader" class="mt-4 hidden rounded-2xl overflow-hidden"></div>
                </div>
            </div>

            <div id="client-rewards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-6">
                <!-- Premios -->
            </div>
        </section>

        <!-- VISTA ADMIN -->
        <section id="admin-view" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- PENDIENTES ADMIN -->
                <div class="glass-card p-6 border-l-8 border-amber-400">
                    <h3 class="font-black mb-4 text-xs uppercase flex justify-between">
                        Entregas Pendientes <span id="admin-pending-count" class="bg-amber-400 text-white px-2 rounded">0</span>
                    </h3>
                    <div id="admin-pending-redemptions" class="space-y-3"></div>
                </div>

                <div class="glass-card p-6">
                    <h3 class="font-black mb-4 text-xs uppercase text-slate-400">Generar Código</h3>
                    <input type="number" id="qr-amount" placeholder="Valor de venta" class="w-full p-4 mb-4 rounded-2xl bg-slate-100 border-none outline-none">
                    <button onclick="generateQR()" class="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl">Crear Ticket</button>
                    <div id="qr-result" class="mt-4 flex justify-center p-4 bg-white rounded-2xl"></div>
                </div>
            </div>

            <!-- TU TABLA ORIGINAL CON BOTONES WHATSAPP Y ELIMINAR -->
            <div class="glass-card p-6">
                <h3 class="font-black mb-4 text-xs uppercase">Gestión de Clientes</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[10px] text-slate-400 border-b">
                                <th class="pb-4">CLIENTE</th>
                                <th class="pb-4 text-center">PUNTOS</th>
                                <th class="pb-4 text-right">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="admin-clients-table"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, deleteDoc, onSnapshot, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCahZbwdPB5zBR_rdxTp4RIRmUoiGkyUOk",
            authDomain: "fidelidad-487f8.firebaseapp.com",
            projectId: "fidelidad-487f8",
            storageBucket: "fidelidad-487f8.firebasestorage.app",
            messagingSenderId: "840301803243",
            appId: "1:840301803243:web:be1612291a7765dab5b0ae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        // --- FUNCION DE CANJE CORREGIDA (PARA QUE SE MUESTRE) ---
        window.redeemProduct = async (prodName, pointsCost) => {
            if (window.activeClient.points < pointsCost) return alert("No tienes suficientes puntos, parce.");
            
            if (confirm(`¿Canjear ${prodName} por ${pointsCost} puntos?`)) {
                try {
                    // 1. Restar puntos al cliente
                    const clientRef = doc(db, "clients", window.activeClient.id);
                    await updateDoc(clientRef, { points: window.activeClient.points - pointsCost });

                    // 2. CREAR EL REGISTRO EN 'redemptions' (Esto era lo que faltaba o fallaba)
                    await addDoc(collection(db, "redemptions"), {
                        clientName: window.activeClient.name,
                        clientPhone: window.activeClient.phone,
                        productName: prodName,
                        status: "pendiente",
                        date: new Date().toLocaleString(),
                        createdAt: Date.now()
                    });

                    alert("¡Canje solicitado con éxito!");
                } catch (e) {
                    alert("Error al procesar: " + e.message);
                }
            }
        };

        // --- LISTENERS EN TIEMPO REAL ---
        onSnapshot(collection(db, "products"), (s) => {
            window.availableProducts = s.docs.map(d => ({id: d.id, ...d.data()}));
            renderProducts();
        });

        onSnapshot(collection(db, "clients"), (s) => {
            window.registeredClients = s.docs.map(d => ({id: d.id, ...d.data()}));
            updateAdminTable();
            if(window.activeClient) {
                const me = window.registeredClients.find(c => c.phone === window.activeClient.phone);
                if(me) {
                    window.activeClient = me;
                    document.getElementById('client-points').innerText = me.points;
                }
            }
        });

        // LISTENER DE CANJES (CLAVE PARA EL HISTORIAL)
        onSnapshot(collection(db, "redemptions"), (s) => {
            window.allRedemptions = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.createdAt - a.createdAt);
            renderRedemptions();
        });

        window.deleteClient = async (id) => { if(confirm("¿Eliminar cliente?")) await deleteDoc(doc(db, "clients", id)); };
        window.deliverItem = async (id) => { await updateDoc(doc(db, "redemptions", id), { status: "entregado" }); };
    </script>

    <script>
        window.activeClient = null;
        window.allRedemptions = [];

        function switchView(v) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(v + '-view').classList.remove('hidden');
            document.getElementById('btn-nav-admin').classList.toggle('hidden', v === 'auth');
            document.getElementById('btn-logout').classList.toggle('hidden', v === 'auth');
        }

        async function handleLogin() {
            const name = document.getElementById('login-identifier').value.trim();
            const phone = document.getElementById('login-secret').value.trim();
            if(name === "josefrank" && phone === "199818") { switchView('admin'); return; }
            
            let client = window.registeredClients.find(c => c.phone === phone);
            if(!client) {
                const { addDoc, collection } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
                const docRef = await addDoc(collection(window.db, "clients"), { name, phone, points: 50 });
                client = { id: docRef.id, name, phone, points: 50 };
            }
            window.activeClient = client;
            document.getElementById('client-name').innerText = client.name;
            document.getElementById('client-phone-display').innerText = client.phone;
            switchView('client');
        }

        function renderRedemptions() {
            // Historial Cliente
            if(window.activeClient) {
                const cList = document.getElementById('client-redemptions-list');
                const mine = window.allRedemptions.filter(r => r.clientPhone === window.activeClient.phone);
                cList.innerHTML = mine.map(r => `
                    <div class="p-3 bg-white/50 rounded-xl flex justify-between items-center text-xs">
                        <div><b>${r.productName}</b><br><span class="text-slate-400">${r.date}</span></div>
                        <span class="font-black ${r.status === 'pendiente' ? 'text-amber-500' : 'text-emerald-500'}">${r.status.toUpperCase()}</span>
                    </div>
                `).join('') || '<p class="text-center text-xs text-slate-400">No has hecho canjes.</p>';
            }

            // Panel Admin
            const aList = document.getElementById('admin-pending-redemptions');
            const pending = window.allRedemptions.filter(r => r.status === "pendiente");
            document.getElementById('admin-pending-count').innerText = pending.length;
            aList.innerHTML = pending.map(r => `
                <div class="p-3 bg-white rounded-xl flex justify-between items-center shadow-sm">
                    <div class="text-xs"><b>${r.productName}</b><br><span class="text-indigo-600 font-bold">${r.clientName}</span></div>
                    <button onclick="deliverItem('${r.id}')" class="bg-emerald-500 text-white px-3 py-1 rounded-lg text-[10px] font-black">ENTREGAR</button>
                </div>
            `).join('') || '<p class="text-center text-xs text-slate-400">Nada pendiente.</p>';
        }

        function renderProducts() {
            const cont = document.getElementById('client-rewards-container');
            cont.innerHTML = window.availableProducts.map(p => `
                <div class="glass-card p-6 flex justify-between items-center">
                    <div><p class="font-black text-slate-900">${p.name}</p><p class="text-xs font-bold text-indigo-600">${p.points} PUNTOS</p></div>
                    <button onclick="redeemProduct('${p.name}', ${p.points})" class="bg-slate-900 text-white px-6 py-2 rounded-xl text-xs font-black">CANJEAR</button>
                </div>
            `).join('');
        }

        function updateAdminTable() {
            const tbody = document.getElementById('admin-clients-table');
            tbody.innerHTML = window.registeredClients.map(c => `
                <tr class="border-b last:border-0">
                    <td class="py-4"><p class="font-black text-sm">${c.name}</p><p class="text-[10px] text-slate-400">${c.phone}</p></td>
                    <td class="text-center font-black text-indigo-600">${c.points}</td>
                    <td class="text-right">
                        <button onclick="window.open('https://wa.me/${c.phone}')" class="text-emerald-500 p-2"><i class="fa-brands fa-whatsapp"></i></button>
                        <button onclick="deleteClient('${c.id}')" class="text-rose-500 p-2"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        // QR LOGIC
        function generateQR() {
            const val = document.getElementById('qr-amount').value;
            if(!val) return;
            document.getElementById('qr-result').innerHTML = '';
            new QRCode(document.getElementById('qr-result'), { text: JSON.stringify({pts: Math.floor(val), id: Date.now()}), width: 120, height: 120 });
        }
    </script>
</body>
</html>
