<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER TOÑITA- Sistema de Puntos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .minimal-card { background: white; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div id="app" class="max-w-md mx-auto min-h-screen p-4">
        
        <section id="login-view" class="pt-12">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black tracking-tight">SUPER <span class="text-indigo-600"> TOÑITA</span></h1>
                <p class="text-slate-400">FIDELIZACION </p>
            </div>
            <div class="minimal-card p-8 space-y-4">
                <input type="text" id="login-user" placeholder="Usuario o Teléfono" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none">
                <input type="password" id="login-pass" placeholder="Contraseña (si aplica)" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none">
                <button onclick="handleAuth()" class="w-full py-4 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition-all">Ingresar</button>
            </div>
        </section>

        <section id="cashier-view" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">Panel Cajero</h2>
                <button onclick="location.reload()" class="text-slate-400 text-sm">Salir</button>
            </div>
            <div class="minimal-card p-6 text-center">
                <i class="fa-solid fa-receipt text-4xl text-indigo-600 mb-4"></i>
                <input type="number" id="bill-amount" placeholder="Monto de la venta ($)" class="w-full text-center text-2xl font-bold py-4 border-b mb-6 focus:outline-none">
                <button onclick="generateTicketQR()" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl">Generar Ticket QR</button>
            </div>
            <div id="qr-result" class="hidden minimal-card p-6 flex flex-col items-center">
                <div id="qrcode-container"></div>
                <p id="qr-value-label" class="mt-4 font-bold text-lg"></p>
                <button onclick="window.print()" class="mt-4 text-slate-500 underline">Imprimir Ticket</button>
            </div>
        </section>

        <section id="admin-view" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">Admin Panel</h2>
                <button onclick="location.reload()" class="text-slate-400 text-sm">Salir</button>
            </div>

            <div class="minimal-card p-6">
                <h3 class="font-bold mb-4">Nuevo Producto de Canje</h3>
                <div class="space-y-3">
                    <input type="text" id="new-prod-name" placeholder="Nombre (Ej: Corte Gratis)" class="w-full px-4 py-2 border rounded-lg">
                    <input type="number" id="new-prod-points" placeholder="Puntos necesarios" class="w-full px-4 py-2 border rounded-lg">
                    <button onclick="saveProduct()" class="w-full py-2 bg-emerald-600 text-white rounded-lg font-bold">Guardar Producto</button>
                </div>
            </div>

            <div class="minimal-card p-6 overflow-hidden">
                <h3 class="font-bold mb-4">Listado de Clientes</h3>
                <div id="clients-list" class="space-y-4 max-h-96 overflow-y-auto">
                    </div>
            </div>
        </section>

        <section id="client-view" class="hidden space-y-6">
            <div class="minimal-card p-8 text-center bg-indigo-600 text-white">
                <p class="text-indigo-100 text-sm uppercase tracking-widest mb-2">Tus Puntos</p>
                <h2 id="client-points-display" class="text-6xl font-black">0</h2>
            </div>
            <div id="rewards-container" class="grid grid-cols-1 gap-4">
                </div>
        </section>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            // PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        // --- SEGURIDAD ---
        const MASTER_KEY = "199819";

        // --- MANEJO DE VISTAS ---
        function showView(viewId) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        // --- AUTENTICACIÓN ---
        window.handleAuth = async function() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;

            if (user === "josefrank" && pass === "199818") {
                showView('admin-view');
                loadAdminData();
            } else if (user === "cajero" && pass === "cajero123") {
                showView('cashier-view');
            } else {
                // Lógica para buscar cliente por teléfono
                const q = query(collection(db, "clients"), where("phone", "==", user));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    window.activeClient = { id: snap.docs[0].id, ...snap.docs[0].data() };
                    showView('client-view');
                    loadRewards();
                } else {
                    alert("Usuario no encontrado.");
                }
            }
        };

        // --- FUNCIONES ADMIN ---
        window.saveProduct = async function() {
            const name = document.getElementById('new-prod-name').value;
            const points = parseInt(document.getElementById('new-prod-points').value);
            if (!name || !points) return alert("Llena los campos");

            await addDoc(collection(db, "products"), { name, points });
            alert("Producto agregado");
            location.reload();
        };

        window.deleteClient = async function(id) {
            const check = prompt("Ingrese clave de seguridad para eliminar:");
            if (check === MASTER_KEY) {
                await deleteDoc(doc(db, "clients", id));
                alert("Cliente eliminado");
            } else {
                alert("Clave incorrecta");
            }
        };

        window.sendWhatsApp = function(phone, name) {
            const msg = `¡Hola ${name}! Tienes puntos acumulados en la barbería. ¡Ven hoy a canjearlos!`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
        };

        async function loadAdminData() {
            const container = document.getElementById('clients-list');
            onSnapshot(collection(db, "clients"), (snap) => {
                container.innerHTML = '';
                snap.forEach(d => {
                    const c = d.data();
                    container.innerHTML += `
                        <div class="flex justify-between items-center p-3 border-b">
                            <div>
                                <p class="font-bold">${c.name}</p>
                                <p class="text-xs text-slate-500">${c.points} pts</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="sendWhatsApp('${c.phone}', '${c.name}')" class="text-emerald-600 p-2"><i class="fa-brands fa-whatsapp"></i></button>
                                <button onclick="deleteClient('${d.id}')" class="text-rose-600 p-2"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
                });
            });
        }

        // --- FUNCIONES CAJERO ---
        window.generateTicketQR = function() {
            const amount = Math.floor(document.getElementById('bill-amount').value);
            if (amount <= 0) return alert("Monto inválido");
            
            const qrContainer = document.getElementById('qrcode-container');
            qrContainer.innerHTML = ''; // Limpiar anterior
            const code = `TICKET-${Date.now()}-${amount}`;
            
            // Aquí usarías tu librería de QR (ej. QRCode.js)
            qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${code}" />`;
            document.getElementById('qr-value-label').innerText = `${amount} Puntos`;
            document.getElementById('qr-result').classList.remove('hidden');
        };

    </script>
</body>
</html>
