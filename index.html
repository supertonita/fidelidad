<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER TOÑITA-FIDELIZACION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
        #qr-reader { width: 100% !important; border: none !important; border-radius: 1.5rem; overflow: hidden; background: black; }
        .btn-active { transform: scale(0.95); }
    </style>
</head>
<body class="pb-24">

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 z-50 px-6 py-3">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="switchView('auth')" id="btn-nav-auth" class="flex flex-col items-center text-indigo-600">
                <i class="fa-solid fa-user-lock text-xl"></i>
                <span class="text-[10px] mt-1 font-bold">Login</span>
            </button>
            <button onclick="switchView('client')" id="btn-nav-client" class="hidden flex flex-col items-center text-slate-400">
                <i class="fa-solid fa-star text-xl"></i>
                <span class="text-[10px] mt-1 font-bold">Puntos</span>
            </button>
            <button onclick="switchView('admin')" id="btn-nav-admin" class="hidden flex flex-col items-center text-slate-400">
                <i class="fa-solid fa-gauge-high text-xl"></i>
                <span class="text-[10px] mt-1 font-bold">Panel</span>
            </button>
            <button onclick="logout()" id="btn-logout" class="hidden flex flex-col items-center text-rose-400">
                <i class="fa-solid fa-power-off text-xl"></i>
                <span class="text-[10px] mt-1 font-bold">Salir</span>
            </button>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 pt-6">
        <section id="auth-view" class="space-y-6">
            <div class="text-center py-8">
                <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto shadow-xl mb-4">
                    <i class="fa-solid fa-bolt text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-900">SUPER TOÑITA - FIDELIZACION</h1>
                <p class="text-slate-500 text-sm">Escanea, acumula y gana</p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <input type="text" id="login-identifier" placeholder="Tu Nombre / Usuario" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 outline-none focus:border-indigo-500 transition-all">
                <input type="password" id="login-secret" placeholder="Tu Teléfono (será tu clave)" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 outline-none focus:border-indigo-500 transition-all">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">ENTRAR AL SISTEMA</button>
            </div>
        </section>

        <section id="client-view" class="hidden space-y-6">
            <div class="bg-indigo-600 rounded-3xl p-6 text-white shadow-xl">
                <p class="text-indigo-100 text-xs font-bold uppercase">Mis Puntos</p>
                <div class="flex items-baseline gap-2">
                    <h2 class="text-6xl font-black mt-1" id="client-points">0</h2>
                    <span class="text-indigo-200 font-bold">pts</span>
                </div>
                <p class="text-indigo-200 text-xs mt-4"><i class="fa-solid fa-user mr-1"></i> <span id="client-name-span">---</span></p>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-bold mb-4 text-sm text-slate-800 tracking-wide">SUMAR PUNTOS</h3>
                <div id="qr-reader" class="hidden mb-4 border-4 border-indigo-50"></div>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="qr-input" placeholder="Código de ticket" class="flex-1 px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 text-sm outline-none">
                    <button onclick="claimPoints()" class="bg-slate-900 text-white px-4 rounded-xl font-bold active:scale-90 transition-all">Validar</button>
                </div>
                <button onclick="startCameraScanner()" id="btn-scan" class="w-full border-2 border-indigo-600 text-indigo-600 font-bold py-3 rounded-xl hover:bg-indigo-50 active:scale-95 transition-all">
                    <i class="fa-solid fa-camera mr-2"></i> ESCANEAR QR
                </button>
            </div>

            <div class="space-y-4">
                <h3 class="font-bold text-slate-900 px-1">Premios Disponibles</h3>
                <div id="client-rewards-container" class="space-y-3"></div>
            </div>
        </section>

        <section id="admin-view" class="hidden space-y-6">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xl font-black text-slate-900" id="admin-title">Panel</h2>
                <span id="role-badge" class="bg-amber-100 text-amber-700 text-[10px] font-bold px-3 py-1 rounded-full uppercase">DUEÑO</span>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-bold mb-4 text-xs text-slate-400 tracking-widest">GENERAR TICKET</h3>
                <input type="number" id="qr-bill-amount" placeholder="Monto total de venta ($)" class="w-full px-4 py-4 rounded-xl bg-slate-50 border border-slate-100 mb-4 font-bold text-xl outline-none focus:border-indigo-500">
                <button onclick="generateQRCodes()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">CREAR CÓDIGO QR</button>
                
                <div id="qr-result-area" class="hidden mt-6 flex flex-col items-center bg-white p-6 rounded-2xl border-2 border-dashed border-slate-200">
                    <div id="qr-points-container" class="p-2"></div>
                    <p id="qr-points-label" class="mt-4 font-black text-indigo-600 text-lg"></p>
                    <button onclick="printQRCodes()" class="mt-4 text-xs font-bold text-slate-400 underline">IMPRIMIR TICKET</button>
                </div>
            </div>

            <div id="admin-only-content" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-bold mb-4 text-xs text-slate-400 uppercase">Gestión de Premios</h3>
                    <input type="text" id="new-product-name" placeholder="Ej: Corte de pelo gratis" class="w-full px-4 py-2 rounded-xl bg-slate-50 border border-slate-100 mb-2">
                    <input type="number" id="new-product-points" placeholder="Puntos" class="w-full px-4 py-2 rounded-xl bg-slate-50 border border-slate-100 mb-4">
                    <button onclick="addProduct()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl active:scale-95">AÑADIR PREMIO</button>
                    <div id="admin-products-list" class="mt-4 space-y-2"></div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-4 bg-slate-50 font-bold text-xs text-slate-500">CLIENTES Y WHATSAPP</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <tbody id="admin-clients-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="qr-link-container" class="hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO_ID",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        window.activeClient = null;
        window.registeredClients = [];
        window.availableProducts = [];

        // LISTENERS
        onSnapshot(collection(db, "clients"), (snap) => {
            window.registeredClients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (window.activeClient) {
                const me = window.registeredClients.find(c => c.id === window.activeClient.id);
                if (me) {
                    window.activeClient = me;
                    document.getElementById('client-points').innerText = me.points;
                }
            }
            updateClientsTable();
            renderProducts();
        });

        onSnapshot(collection(db, "products"), (snap) => {
            window.availableProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderProducts();
        });

        // NAVEGACIÓN
        window.switchView = (view) => {
            ['auth', 'client', 'admin'].forEach(v => {
                document.getElementById(v+'-view').classList.add('hidden');
                document.getElementById('btn-nav-'+v).classList.replace('text-indigo-600', 'text-slate-400');
            });
            document.getElementById(view+'-view').classList.remove('hidden');
            document.getElementById('btn-nav-'+view).classList.replace('text-slate-400', 'text-indigo-600');
        };

        // LOGIN
        window.handleLogin = async () => {
            const user = document.getElementById('login-identifier').value.trim();
            const pass = document.getElementById('login-secret').value.trim();
            if(!user || !pass) return alert("Ingresa tus datos");

            if(user === "josefrank" && pass === "199818") {
                window.userRole = 'admin';
                showAdminPanel(true);
                return;
            }
            if(user === "cajero" && pass === "puntos123") {
                window.userRole = 'staff';
                showAdminPanel(false);
                return;
            }

            let c = window.registeredClients.find(x => x.phone === pass);
            if(!c) {
                const res = await addDoc(collection(db, "clients"), { name: user, phone: pass, points: 0 });
                c = { id: res.id, name: user, phone: pass, points: 0 };
            }
            window.activeClient = c;
            document.getElementById('client-name-span').innerText = c.name;
            document.getElementById('btn-nav-client').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            switchView('client');
        };

        function showAdminPanel(isFullAdmin) {
            document.getElementById('admin-title').innerText = isFullAdmin ? 'Administrador' : 'Cajero';
            document.getElementById('role-badge').innerText = isFullAdmin ? 'DUEÑO' : 'STAFF';
            document.getElementById('admin-only-content').classList.toggle('hidden', !isFullAdmin);
            document.getElementById('btn-nav-admin').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            switchView('admin');
        }

        // --- PUNTOS Y QR ---
        window.generateQRCodes = () => {
            const amt = parseFloat(document.getElementById('qr-bill-amount').value);
            if(!amt) return alert("Monto inválido");
            const pts = Math.floor(amt);
            const tktId = "TKT-" + Math.random().toString(36).substring(2, 9).toUpperCase();
            const data = `PTS|${pts}|${tktId}`;

            document.getElementById('qr-result-area').classList.remove('hidden');
            document.getElementById('qr-points-label').innerText = `${pts} PUNTOS`;
            document.getElementById('qr-points-container').innerHTML = '';
            new QRCode(document.getElementById('qr-points-container'), { text: data, width: 180, height: 180 });
            
            document.getElementById('qr-link-container').innerHTML = '';
            new QRCode(document.getElementById('qr-link-container'), { text: window.location.href, width: 100, height: 100 });
        };

        window.claimPoints = async () => {
            const code = document.getElementById('qr-input').value.trim();
            if(!window.activeClient || !code.includes('|')) return alert("Código inválido");

            const [prefix, pts, tktId] = code.split('|');
            if(prefix !== "PTS") return alert("Código no reconocido");

            try {
                // VERIFICACIÓN MANUAL ANTES DE ESCRIBIR
                const codeRef = doc(db, "used_codes", tktId);
                const codeSnap = await getDoc(codeRef);

                if(codeSnap.exists()) {
                    alert("❌ EL TICKET YA FUE USADO");
                    return;
                }

                // 1. REGISTRAR USO
                await setDoc(codeRef, { 
                    user: window.activeClient.phone, 
                    pts: pts, 
                    date: serverTimestamp() 
                });
                
                // 2. ACTUALIZAR CLIENTE
                const clientRef = doc(db, "clients", window.activeClient.id);
                const newTotal = (window.activeClient.points || 0) + parseInt(pts);
                await updateDoc(clientRef, { points: newTotal });

                alert(`🎯 ¡Felicidades! Sumaste ${pts} puntos.`);
                document.getElementById('qr-input').value = '';
                if(window.scanner) window.stopCameraScanner();

            } catch(e) {
                console.error(e);
                alert("Error técnico: " + e.message);
            }
        };

        // --- WHATSAPP Y ADMIN ---
        window.sendWhatsApp = (phone, name, points) => {
            const msg = `Hola ${name}, tienes ${points} puntos en Loyalty Pro. ¡Ven pronto a canjear tus premios!`;
            window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        function updateClientsTable() {
            const t = document.getElementById('admin-clients-table');
            if(!t) return;
            t.innerHTML = '';
            window.registeredClients.forEach(c => {
                t.innerHTML += `
                    <tr class="border-b border-slate-50">
                        <td class="p-4 font-bold text-slate-700">${c.name}<br><span class="text-[10px] text-slate-400 font-normal">${c.phone}</span></td>
                        <td class="p-4 text-indigo-600 font-black text-center">${c.points}</td>
                        <td class="p-4 text-right flex gap-2 justify-end">
                            <button onclick="sendWhatsApp('${c.phone}', '${c.name}', ${c.points})" class="text-emerald-500 bg-emerald-50 p-2 rounded-lg"><i class="fa-brands fa-whatsapp text-lg"></i></button>
                            <button onclick="deleteClient('${c.id}')" class="text-rose-400 p-2"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        window.deleteClient = async (id) => {
            if(prompt("PIN de seguridad:") === "199818") await deleteDoc(doc(db, "clients", id));
        };

        // PREMIOS
        function renderProducts() {
            const cont = document.getElementById('client-rewards-container');
            const adm = document.getElementById('admin-products-list');
            if(!cont || !adm) return;
            cont.innerHTML = ''; adm.innerHTML = '';
            window.availableProducts.forEach(p => {
                const can = window.activeClient && window.activeClient.points >= p.points;
                cont.innerHTML += `
                    <div class="p-4 bg-white rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                        <div><p class="font-bold text-slate-900">${p.name}</p><p class="text-xs text-indigo-600 font-bold">${p.points} pts</p></div>
                        <button onclick="redeemProduct(${p.points}, '${p.name}')" class="px-4 py-2 rounded-xl text-xs font-black ${can?'bg-indigo-600 text-white shadow-md':'bg-slate-50 text-slate-400'}">CANJEAR</button>
                    </div>`;
                adm.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg text-xs">
                        <span>${p.name} (${p.points})</span>
                        <button onclick="deleteProduct('${p.id}')" class="text-rose-500 font-bold">BORRAR</button>
                    </div>`;
            });
        }

        window.redeemProduct = async (pts, name) => {
            if(window.activeClient.points < pts) return;
            if(confirm(`¿Canjear ${name}?`)) {
                await updateDoc(doc(db, "clients", window.activeClient.id), { points: window.activeClient.points - pts });
                alert("¡Canje exitoso!");
            }
        };

        window.addProduct = async () => {
            const n = document.getElementById('new-product-name').value;
            const p = parseInt(document.getElementById('new-product-points').value);
            if(n && p) {
                await addDoc(collection(db, "products"), { name: n, points: p });
                document.getElementById('new-product-name').value = '';
                document.getElementById('new-product-points').value = '';
            }
        };

        window.deleteProduct = async (id) => { if(confirm("¿Borrar premio?")) await deleteDoc(doc(db, "products", id)); };

        // ESCÁNER
        window.startCameraScanner = () => {
            document.getElementById('qr-reader').classList.remove('hidden');
            window.scanner = new Html5Qrcode("qr-reader");
            window.scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => {
                document.getElementById('qr-input').value = text;
                window.claimPoints();
            });
        };
        window.stopCameraScanner = () => { if(window.scanner) window.scanner.stop().then(()=>document.getElementById('qr-reader').classList.add('hidden')); };

        // PRINT
        window.printQRCodes = () => {
            const win = window.open('', '', 'width=300,height=600');
            win.document.write(`<html><body style="text-align:center;font-family:monospace;padding:10px;"><h2>LOYALTY PRO</h2><hr>${document.getElementById('qr-points-container').innerHTML}<h1>${document.getElementById('qr-points-label').innerText}</h1><p>Escanea para sumar</p></body></html>`);
            win.document.close();
            setTimeout(() => { win.print(); win.close(); }, 500);
        };

        window.logout = () => location.reload();
        window.switchView('auth');
    </script>
</body>
</html>
